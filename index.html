function save(){try{localStorage.setItem(KEY,JSON.stringify(db));}catch(e){document.getElementById('storageAlert').hidden=false;}badge();}
function badge(){document.getElementById('wrongBadge').textContent=db.wrong.length;}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function action(id,fn){const el=document.getElementById(id);if(el)el.onclick=fn;}
function go(name,render){view=name;document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));const nav=document.getElementById(name==='wrong'?'navWrong':name==='words'?'navWords':'navHome');nav.classList.add('active');render();window.scrollTo({top:0,behavior:'instant'});badge();}
function home(){go('home',()=>{const done=Object.keys(db.attempts).filter(id=>byId[id]).length;const acc=db.total?Math.round(db.correct/db.total*100):0;app.innerHTML=`${db.session?`<div class="resume"><p><b>還有一段未完成的練習</b><br>${esc(db.session.label)} · 已作答 ${Object.keys(db.session.answers).length}/${db.session.ids.length} 題${db.session.mode==='exam'?' · 計時仍然繼續':''}</p><button id="resume" class="btn secondary">繼續練習 →</button></div>`:''}<section class="hero"><div><div class="eyebrow">YOUR CHINESE LEARNING ADVENTURE</div><h1>小六加強版，<br><em>讀懂弦外之音。</em></h1><p>保留指定詞語，挑戰近義辨析、主旨概括與推論。</p><span class="pill">${BANK.length} 道精選題目</span><span class="pill">4 大溫習範疇</span><span class="pill">近義辨析・深入理解</span></div><div class="art" aria-hidden="true"><div class="orbit"></div><div class="book">學<small>一步一印</small></div><div class="tile a">思</div><div class="tile b">悟</div><div class="spark">✦</div></div></section><section class="stats"><div class="stat"><span class="icon">▤</span><div><strong>${done}</strong><label>已練習 / ${BANK.length} 題</label></div></div><div class="stat"><span class="icon">◎</span><div><strong>${acc}<small style="font-size:13px">%</small></strong><label>累積答對率</label></div></div><div class="stat"><span class="icon">↻</span><div><strong>${db.wrong.length}</strong><label>待重溫錯題</label></div></div><div class="stat"><span class="icon">⚑</span><div><strong>${db.tests.length}</strong><label>已完成模擬測驗</label></div></div></section><div class="layout"><section><div class="section-heading"><h2>今天，想練習甚麼？</h2><button class="btn ghost" id="all" style="padding:3px 0;font-size:12px">${selected==='全部範疇'?'✓ 已選全部範疇':'選擇全部範疇'}</button></div><div class="cards">${CATS.map((cat,i)=>{const qs=BANK.filter(q=>q.cat===cat),n=qs.filter(q=>db.attempts[q.id]).length;return `<button class="category ${selected===cat?'selected':''}" data-cat="${cat}" aria-pressed="${selected===cat}" style="--tint:${COLORS[i][0]};--tone:${COLORS[i][1]}"><div class="top"><span class="cat-icon">${['詞','辨','句','段'][i]}</span><span class="count">${qs.length} 題 ↗</span></div><h3>${cat}</h3><p>${DESCS[i]}</p><div class="progress"><i style="width:${n/qs.length*100}%"></i></div><div class="progress-text"><span>已練習 ${n} / ${qs.length}</span><span>${Math.round(n/qs.length*100)}%</span></div></button>`;}).join('')}</div><div class="startbar"><label for="practiceMode">${selected}</label><select id="practiceMode" aria-label="練習模式"><option value="sequence">順序練習</option><option value="random">隨機練習</option></select><select id="practiceCount" aria-label="每回合題數"><option value="10">每回合 10 題</option><option value="20">每回合 20 題</option><option value="all">全部題目</option></select><button id="startPractice" class="btn">開始練習 <span>→</span></button></div><p class="subtext">順序練習會記住進度；完成一輪後可再次重溫。</p></section><aside><section class="side-card dark"><div class="eyebrow">READY FOR A CHALLENGE?</div><h2 style="margin-top:8px">限時模擬測驗</h2><div class="timebadge">05:00 <small>／20 題</small></div><p>四類題目各抽 5 題。<br>挑戰專注力，交卷後查看解析。</p><button id="exam" class="btn light">開始挑戰 →</button></section><section class="side-card"><h3>↻ 把錯題變成強項</h3><p class="tip">${db.wrong.length?`你有 ${db.wrong.length} 題等待重溫。再想一次，找回信心。`:'答錯的題目會自動收進錯題本，答對後即可移除。'}</p><button id="wrong" class="btn ghost" style="padding:13px 0 0">打開我的錯題本 →</button></section><div class="badge-row">${[[1,'啟程新星'],[50,'勤學探索者'],[150,'閱讀探險家']].map(([n,t])=>`<span class="badge ${done>=n?'earned':''}">${done>=n?'✦':'◇'} ${t}</span>`).join('')}</div></aside></div>`;action('resume',resume);action('all',()=>{selected='全部範疇';home();});document.querySelectorAll('[data-cat]').forEach(el=>el.onclick=()=>{selected=el.dataset.cat;home();});action('startPractice',()=>start(document.getElementById('practiceMode').value,selected,document.getElementById('practiceCount').value));action('exam',()=>start('exam'));action('wrong',wrong);});}
function canStart(){if(!db.session)return true;return confirm('開始新練習會結束目前未完成的一回合。已確認的練習紀錄會保留；未交卷的測驗答案不會計分。繼續嗎？');}
function start(mode,cat='全部範疇',count='20',onlyIds=null){if(!canStart())return;clearInterval(ticker);let pool=BANK.filter(q=>cat==='全部範疇'||q.cat===cat),ids=[];let from=0;
if(mode==='exam'){ids=shuffle(CATS.flatMap(c=>shuffle(BANK.filter(q=>q.cat===c)).slice(0,5).map(q=>q.id)));}
else if(mode==='wrong'){ids=shuffle((onlyIds||db.wrong).filter(id=>byId[id]));if(!ids.length){wrong();return;}}
else if(mode==='random'){ids=shuffle(pool).slice(0,count==='all'?pool.length:Number(count)).map(q=>q.id);}
else{from=(db.cursor[cat]||0)%pool.length;ids=pool.slice(from,from+(count==='all'?pool.length:Number(count))).map(q=>q.id);}
const options=Object.fromEntries(ids.map(id=>[id,shuffle(byId[id].options)]));db.session={mode,cat,ids,options,index:0,answers:{},checked:{},from,poolLength:pool.length,started:Date.now(),deadline:mode==='exam'?Date.now()+300000:null,label:mode==='exam'?'四大範疇 · 限時測驗':mode==='wrong'?'錯題重做':cat+' · '+(mode==='sequence'?'順序練習':'隨機練習')};save();resume();}
function resume(){if(!db.session)return home();if(!db.session.ids.every(id=>byId[id])){db.session=null;save();return home();}go('session',renderQuestion);clearInterval(ticker);if(db.session?.mode==='exam'){tick();ticker=setInterval(tick,300);}}
function record(q,value){const ok=value===q.answer;db.total++;if(ok)db.correct++;const previous=db.attempts[q.id];db.attempts[q.id]={tries:(previous?.tries||0)+1,correct:ok};db.wrong=db.wrong.filter(id=>id!==q.id);if(!ok)db.wrong.push(q.id);}
function renderQuestion(){const s=db.session;if(!s)return;const q=byId[s.ids[s.index]],isExam=s.mode==='exam',checked=!!s.checked[q.id],answer=s.answers[q.id];app.innerHTML=`<div class="session-wrap"><div class="session-head"><button class="btn secondary" id="leave">← 返回基地</button><h2>${isExam?'限時模擬測驗':'一步一步，讀懂中文'}</h2>${isExam?'<div class="timer" id="timer" aria-label="剩餘時間">05:00</div>':''}</div><div class="session-meta"><span>${esc(s.label)}</span><span>第 ${s.index+1} / ${s.ids.length} 題</span></div><div class="progress"><i style="width:${(s.index+1)/s.ids.length*100}%"></i></div><section class="question-card"><span class="tag">${q.cat}</span>${q.passage?`<div class="passage">${esc(q.passage)}</div>`:''}<div class="stem">${esc(q.stem).replace('＿＿',`<span class="blank">${q.cat==='詞語填充'&&answer?esc(answer):'　　'}</span>`)}</div><div class="options ${q.options.some(o=>o.length>10)?'long':''}" role="group" aria-label="答案選項">${s.options[q.id].map((o,i)=>`<button class="option ${answer===o?'chosen':''} ${checked&&o===q.answer?'correct':''} ${checked&&answer===o&&o!==q.answer?'incorrect':''}" data-answer="${i}" aria-pressed="${answer===o}" ${checked?'disabled':''}><b>${'ABCD'[i]}</b><span>${esc(o)}${checked&&o===q.answer?' ✓':''}</span></button>`).join('')}</div>${checked?`<div class="feedback ${answer===q.answer?'':'bad'}" role="status"><strong>${answer===q.answer?'✓ 答對了！你找到線索了。':'再學一次，下次更有把握。'} 正確答案：${esc(q.answer)}</strong>${esc(q.explanation)}</div>`:''}<div class="actions"><button id="prev" class="btn secondary" ${s.index===0?'disabled':''}>← 上一題</button>${isExam?`<button id="next" class="btn">${s.index===s.ids.length-1?'檢查並交卷':'下一題 →'}</button>`:checked?`<button id="next" class="btn">${s.index===s.ids.length-1?'查看練習成果':'下一題 →'}</button>`:`<button id="check" class="btn" ${!answer?'disabled':''}>確認答案</button>`}</div></section>${isExam?`<div class="question-nav" aria-label="題目導航">${s.ids.map((id,i)=>`<button data-jump="${i}" class="${s.answers[id]?'filled':''} ${s.index===i?'current':''}" aria-label="第${i+1}題${s.answers[id]?'，已作答':'，未作答'}">${i+1}</button>`).join('')}</div><div style="text-align:center"><button id="submit" class="btn secondary">提前交卷</button><p class="subtext">已答 ${Object.keys(s.answers).length} / 20 題 · 到時自動交卷 · 離開頁面仍會計時</p></div>`:'<p class="subtext" style="text-align:center">先找關鍵詞，再把答案放回句子檢查。進度會自動保存。</p>'}</div>`;
action('leave',home);document.querySelectorAll('[data-answer]').forEach(el=>el.onclick=()=>{if(expired())return; s.answers[q.id]=s.options[q.id][Number(el.dataset.answer)];save();renderQuestion();if(isExam)tick();});action('check',()=>{if(s.checked[q.id]||!s.answers[q.id])return;s.checked[q.id]=true;record(q,s.answers[q.id]);if(s.mode==='sequence')db.cursor[s.cat]=s.from+Math.max(...s.ids.map((id,i)=>s.checked[id]?i+1:0));save();renderQuestion();});action('prev',()=>{if(expired())return;s.index--;save();renderQuestion();if(isExam)tick();});action('next',()=>{if(expired())return;if(s.index===s.ids.length-1){isExam?submit():finish(false);}else{s.index++;save();renderQuestion();if(isExam)tick();}});action('submit',submit);document.querySelectorAll('[data-jump]').forEach(el=>el.onclick=()=>{if(expired())return;s.index=Number(el.dataset.jump);save();renderQuestion();tick();});}
function expired(){if(db.session?.mode==='exam'&&Date.now()>=db.session.deadline){finish(true);return true;}return false;}
function tick(){if(expired())return;const el=document.getElementById('timer');if(!el||!db.session)return;const left=Math.max(0,Math.ceil((db.session.deadline-Date.now())/1000));el.textContent=String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0');el.classList.toggle('urgent',left<=60);}
function submit(){if(expired())return;const left=db.session.ids.length-Object.keys(db.session.answers).length;if(confirm(left?`還有 ${left} 題未作答，交卷後會按答錯計算。確定交卷嗎？`:'已完成全部題目，確定交卷並查看結果嗎？'))finish(false);}
function finish(timedOut){const s=db.session;if(!s)return;clearInterval(ticker);if(s.mode==='exam')s.ids.forEach(id=>record(byId[id],s.answers[id]));const correct=s.ids.filter(id=>s.answers[id]===byId[id].answer).length;const used=Math.min(s.mode==='exam'?300:Infinity,Math.max(1,Math.round((Date.now()-s.started)/1000)));if(s.mode==='exam')db.tests.push({at:Date.now(),correct,total:s.ids.length});db.session=null;save();go('result',()=>{app.innerHTML=`<div class="session-wrap"><section class="result-hero"><div class="eyebrow">EVERY TRY IS A STEP FORWARD</div><h2>${timedOut?'時間到，完成挑戰！':'完成了，給自己一個鼓勵！'}</h2><div class="score">${correct}<small> / ${s.ids.length}</small></div><p>答對率 ${Math.round(correct/s.ids.length*100)}% · 用時 ${Math.floor(used/60)} 分 ${used%60} 秒</p><p style="margin-top:8px">${correct===s.ids.length?'全部答對！可以挑戰另一個範疇了。':'看懂解析，再重溫錯題，每一次都會更進一步。'}</p><div class="actions" style="justify-content:center;flex-wrap:wrap"><button id="backHome" class="btn secondary">返回基地</button><button id="redo" class="btn" ${correct===s.ids.length?'disabled':''}>重做本次錯題 →</button></div></section><div class="section-heading"><h2>答案與解析</h2><small>點選題目展開</small></div>${s.ids.map((id,i)=>review(byId[id],s.answers[id],i)).join('')}</div>`;action('backHome',home);action('redo',()=>start('wrong','全部範疇','all',s.ids.filter(id=>s.answers[id]!==byId[id].answer)));});}
function review(q,a,i){const ok=a===q.answer;return `<details class="review"><summary><span class="status ${ok?'':'bad'}">${ok?'答對':a?'待重溫':'未作答'}</span><span>${i+1}. ${esc(q.stem)}</span></summary>${q.passage?`<div class="passage">${esc(q.passage)}</div>`:''}<p>你的答案：${esc(a||'未作答')}　／　<strong>正確答案：${esc(q.answer)}</strong></p><p>${esc(q.explanation)}</p></details>`;}
function wrong(){go('wrong',()=>{app.innerHTML=`<div class="view-title"><div class="eyebrow">LEARN FROM EVERY TRY</div><h1 style="font-size:32px">我的錯題本</h1><p>答錯不是終點，而是找到下一步的線索。重做答對後，題目會自動移出。</p></div>${db.wrong.length?`<div class="toolbar"><h3>有 ${db.wrong.length} 題等待你再次挑戰</h3><button id="redoAll" class="btn">開始錯題重做 →</button></div>${CATS.map(cat=>{const ids=db.wrong.filter(id=>byId[id].cat===cat);return ids.length?`<h3 style="margin:25px 0 10px">${cat} · ${ids.length} 題</h3>${ids.map((id,i)=>{const q=byId[id];return `<details class="review"><summary><span class="status bad">待重溫</span><span>${esc(q.stem)}</span></summary>${q.passage?`<div class="passage">${esc(q.passage)}</div>`:''}<p><strong>正確答案：${q.answer}</strong></p><p>${esc(q.explanation)}</p></details>`;}).join('')}`:'';}).join('')}`:`<div class="empty"><div class="big">✓</div><h2>錯題本暫時是空的</h2><p>完成練習後，答錯的題目會自動收集在這裏。</p><button id="toPractice" class="btn">去練習 →</button></div>`}`;action('redoAll',()=>start('wrong'));action('toPractice',home);});}
function words(){go('words',()=>{app.innerHTML=`<div class="view-title"><div class="eyebrow">YOUR WORD COLLECTION</div><h1 style="font-size:32px">詞語小冊</h1><p>70 個範圍內詞語／單字 · 先理解意思，再放回語境。</p></div><div class="toolbar"><input id="search" class="search" placeholder="搜尋詞語或意思…" aria-label="搜尋詞語或意思"><span class="muted" id="wordCount">70 個詞語／單字</span></div><div class="wordgrid" id="words"></div><p class="subtext">「恐、衰、復、徒」採常見字義及用法；如課本另有指定解釋，可再按課文調整。</p><div style="margin-top:35px"><button id="reset" class="btn danger">清除本機學習紀錄</button><p class="subtext">只會清除本瀏覽器的進度、錯題及未完成練習。</p></div>`;renderWords('');document.getElementById('search').oninput=e=>renderWords(e.target.value);action('reset',()=>{if(confirm('確定清除本瀏覽器的全部學習紀錄？此操作無法復原。')){db=empty();save();home();}});});}
function renderWords(term){const list=VOCAB.filter(v=>(v[0]+v[1]).includes(term.trim()));document.getElementById('wordCount').textContent=list.length+' 個詞語／單字';document.getElementById('words').innerHTML=list.length?list.map(([w,m,s])=>`<article class="wordcard"><h3>${w}</h3><p>${m}</p><small>${esc(s).replace('＿＿',`<b style="color:var(--green)">${w}</b>`)}</small></article>`).join(''):'<p class="muted">找不到符合的詞語，試試另一個字吧。</p>';}
action('brand',e=>{e.preventDefault();home();});action('navHome',home);action('navWrong',wrong);action('navWords',words);document.addEventListener('visibilitychange',()=>{if(!document.hidden&&view==='session')tick();});home();

</script></body></html>
